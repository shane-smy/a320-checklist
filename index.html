<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A320 Checklist">
<title>A320neo Gate to Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Night cockpit: one dark visual world. Sidebar of phases + one big step card, ECAM-style colours. */
:root{
  --bg:#0c131c; --panel:#141e2b; --panel-2:#1b2838; --line:#26364a;
  --text:#e7eef6; --muted:#8ea2b8;
  --cyan:#45c8ec;   /* Airbus "managed"/action blue */
  --green:#4cc58c;  /* done */
  --amber:#f0a83a;  /* note */
  --violet:#b48cf0; --orange:#f08a4b;
  --display:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--display);font-size:17px;line-height:1.45;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;height:100%;min-height:0}
/* sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.brand h1{font-size:19px;margin:0;letter-spacing:.2px;text-wrap:balance}
.brand p{margin:2px 0 10px;color:var(--muted);font-size:13px}
.overall{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.overall i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.overall-txt{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.phases{overflow-y:auto;flex:1;padding:8px;display:flex;flex-direction:column;gap:2px}
.ph{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--muted);font-size:15px}
.ph:hover{background:var(--panel-2)}
.ph.on{background:var(--panel-2);color:var(--text);box-shadow:inset 3px 0 0 var(--cyan)}
.ph .c{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.ph.done{color:var(--green)}
.side-foot{padding:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-foot #listBtn{grid-column:1 / -1}
.ghost{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;flex:1}
.ghost.on{border-color:var(--cyan);color:var(--cyan)}
/* main */
main{display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.topbar{display:none}
.wrap{max-width:820px;width:100%;margin:0 auto;padding:24px 24px 32px;display:flex;flex-direction:column;gap:18px}
.phase-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.phase-head h2{margin:0;font-size:24px;text-wrap:balance}
.phase-head .count{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{display:flex;gap:3px}
.pbar span{flex:1;height:5px;border-radius:3px;background:var(--panel-2)}
.pbar span.d{background:var(--green)} .pbar span.cur{background:var(--cyan)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 26px 22px;display:flex;flex-direction:column;gap:14px}
.card.isdone{border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
.grp{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.item{font-size:30px;font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
.action{font-family:var(--mono);font-weight:600;font-size:26px;color:var(--cyan);background:color-mix(in srgb,var(--cyan) 9%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);border-radius:10px;padding:10px 14px;align-self:flex-start;max-width:100%}
.note{border-left:3px solid var(--amber);padding:4px 0 4px 14px;color:#d5dde7;max-width:65ch}
.note:empty{display:none}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.6px;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.tag.VIDEO{color:var(--violet);border:1px solid var(--violet)}
.tag.NEW{color:var(--green);border:1px solid var(--green)}
.tag.FIXED{color:var(--orange);border:1px solid var(--orange)}
.donebadge{color:var(--green);font-weight:600;font-size:14px}
.controls{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.btn{border:0;border-radius:14px;padding:20px;font-size:20px;font-weight:600}
.btn.back{background:var(--panel-2);border:1px solid var(--line)}
.btn.go{background:var(--green);color:#06210f}
.btn.go.undo{background:var(--panel-2);color:var(--green);border:1px solid var(--green)}
.btn:disabled{opacity:.35;cursor:default}
.hint{font-size:13px;color:var(--muted);text-align:center}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list h3{margin:0;padding:12px 16px;font-size:14px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 16px;font-size:15px}
.row:last-child{border-bottom:0}
.row .tick{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#06210f}
.row.d .tick{background:var(--green);border-color:var(--green)}
.row.d .ri{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.row.cur{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--cyan)}
.row .ra{font-family:var(--mono);font-size:13px;color:var(--cyan);text-align:right}
.phase-done{background:color-mix(in srgb,var(--green) 12%,var(--panel));border:1px solid var(--green);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.phase-done button{background:var(--green);color:#06210f;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
/* list view */
.lv-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lv-head h2{margin:0;font-size:24px}
.lv-phase{scroll-margin-top:70px}
.lv-phase h3{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0;padding:12px 16px;font-size:16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.lv-phase h3 .c{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lv-phase h3.all .c{color:var(--green)}
.lrow{display:grid;grid-template-columns:30px 1fr minmax(120px,38%);gap:12px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;font-size:16px}
.lrow:last-child{border-bottom:0}
.lrow .tick{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;font-size:15px;color:#06210f;margin-top:1px}
.lrow.d .tick{background:var(--green);border-color:var(--green)}
.lrow.d .li{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.lrow .la{font-family:var(--mono);font-size:14px;color:var(--cyan);text-align:right}
.lrow.d .la{color:color-mix(in srgb,var(--cyan) 55%,var(--muted))}
.lrow .ln{display:block;font-size:13px;color:var(--muted);margin-top:3px;text-decoration:none}
.lgrp{padding:8px 16px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);border-bottom:1px solid var(--line)}
.notes-toggle{font-size:14px}
@media (max-width:600px){.lrow{grid-template-columns:30px 1fr}.lrow .la{grid-column:2;text-align:left}}
/* reference */
.ref h2{font-size:22px;margin:8px 0 10px}
.ref table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
.ref th{background:var(--panel-2);text-align:left;color:var(--muted);font-weight:600;font-size:13px}
.ref th,.ref td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.ref td:first-child{font-family:var(--mono);color:var(--cyan);white-space:nowrap}
.tblwrap{overflow-x:auto}
.metar{font-family:var(--mono);background:var(--panel-2);padding:10px 12px;border-radius:8px;display:inline-block;color:var(--amber)}
/* dialog */
.modal{position:fixed;inset:0;background:rgba(3,7,12,.7);display:none;place-items:center;padding:16px;z-index:10}
.modal.show{display:grid}
.modal div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:380px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0}
.modal .bt{display:flex;gap:10px}
.modal .bt button{flex:1;border-radius:10px;padding:12px;border:1px solid var(--line);background:var(--panel-2)}
.modal .bt .danger{background:var(--orange);color:#200a00;border:0;font-weight:600}
/* narrow */
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{display:none}
  .topbar{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
  .topbar select{flex:1;min-width:0;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:15px}
  .topbar .ghost{flex:0 0 auto}
  .wrap{padding:16px 16px 28px}
  .item{font-size:25px} .action{font-size:21px}
  .card{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>A320neo Gate to Gate</h1>
      <p>iniBuilds A320neo V2 · MSFS 2024</p>
      <div class="overall"><i id="ovbar"></i></div>
      <div class="overall-txt" id="ovtxt"></div>
    </div>
    <nav class="phases" id="phases" aria-label="Phases"></nav>
    <div class="side-foot">
      <button class="ghost" id="listBtn" type="button">List view</button>
      <button class="ghost" id="refBtn" type="button">Reference</button>
      <button class="ghost" id="resetBtn" type="button">New flight</button>
    </div>
  </aside>
  <main id="main">
    <div class="topbar">
      <select id="phaseSel" aria-label="Phase"></select>
      <button class="ghost" id="listBtn2" type="button">List</button>
      <button class="ghost" id="refBtn2" type="button">Ref</button>
      <button class="ghost" id="resetBtn2" type="button">Reset</button>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div>
    <h3 id="mt">Start a new flight?</h3>
    <p style="margin:0;color:var(--muted)">This clears every tick so you can run the checklist from the top.</p>
    <div class="bt"><button type="button" id="mNo">Cancel</button><button type="button" class="danger" id="mYes">Clear ticks</button></div>
  </div>
</div>
<script>
const DATA = [{"t":"0. Before you load the sim","s":[{"i":"SimBrief flight plan","a":"Generate OFP","n":"Aircraft type must be exactly A20N, or the performance numbers will be wrong and the plan won't load. Note cruise level, cost index and planned runways.","t":"","g":null},{"i":"Departure & destination weather","a":"Check METARs","n":"metar-taf.com/EGSS etc. Wind tells you the runway; the Q number is the QNH. See the METAR section at the back.","t":"","g":null},{"i":"Charts","a":"Open SID + approach charts","n":"Navigraph or ChartFox. You need: SID altitude restrictions, transition altitude, ILS frequency/course, minimums, missed approach altitude.","t":"","g":null},{"i":"Spawn","a":"Gate / parking, cold & dark","n":"Choose the iniBuilds A320neo and a parking spot as start position.","t":"","g":null},{"i":"iniBuilds options (first time only)","a":"SimBrief Pilot ID","n":"Set in the EFB Options page so the EFB and INIT REQUEST can import your flight.","t":"NEW","g":null},{"i":"EFB option (optional)","a":"Instant IRS alignment","n":"The EFB has an option to make the ADIRS align instantly instead of waiting several minutes.","t":"VIDEO","g":null},{"i":"Throttle detents (first time only)","a":"Calibrate","n":"Set IDLE / CL / FLX-MCT / TOGA positions for your HOTAS throttle in the EFB/aircraft options.","t":"NEW","g":null},{"i":"Autopilot disconnect button (first time only)","a":"Bind \"Toggle Disengage Autopilot\"","n":"Bind this in MSFS Controls (not \"Autopilot Master\"). In the video Jon notes the disconnect is now on the stick button, like the real aircraft.","t":"NEW","g":null}]},{"t":"1. Walkaround (outside)","s":[{"i":"Outside view","a":"Shift + C","n":"MSFS 2024 lets you walk around the aircraft.","t":"VIDEO","g":null},{"i":"Wheel chocks","a":"Remove","n":"Can also be done from the EFB ground services page.","t":"VIDEO","g":null},{"i":"Engine covers","a":"Remove","n":"VIDEO","t":"","g":null},{"i":"Back to cockpit","a":"Shift + C","n":"","t":"","g":null}]},{"t":"2. Power up – overhead panel","s":[{"i":"BAT 1 + BAT 2","a":"ON","n":"Check battery voltage is about 25.5 V or more on the ELEC page.","t":"NEW","g":null},{"i":"EXT PWR","a":"ON","n":"At the gate the green AVAIL light shows. If not, request the GPU from the EFB ground services page.","t":"","g":null},{"i":"Strobe","a":"AUTO","n":"Do this straight away. Strobes come on by themselves after takeoff.","t":"","g":null},{"i":"NAV & LOGO lights","a":"ON (1 or 2)","n":"Nav lights are on whenever the aircraft is powered. Either position is fine.","t":"FIXED","g":null},{"i":"APU MASTER","a":"ON","n":"","t":"","g":null},{"i":"APU START","a":"Wait a few seconds, then press","n":"Wait for AVAIL on the APU start button / upper ECAM. The APU page shows automatically on the lower ECAM.","t":"","g":null},{"i":"Crew oxygen (CREW SUPPLY)","a":"ON","n":"Press so the OFF light goes out.","t":"","g":null},{"i":"Emergency exit lights","a":"ARM","n":"","t":"","g":null},{"i":"No smoking","a":"AUTO","n":"","t":"","g":null},{"i":"ADIRS 1, 2, 3","a":"NAV","n":"Takes several minutes to align unless instant alignment is set in the EFB.","t":"","g":null},{"i":"CVR (cockpit voice recorder)","a":"GND CTL ON","n":"","t":"","g":null},{"i":"Fire tests","a":"APU + ENG 1 + ENG 2","n":"Optional. Press and hold each TEST button; check the warnings, then release.","t":"","g":null},{"i":"Display brightness","a":"Adjust if needed","n":"Knobs next to each screen. Turn down if flying at night.","t":"VIDEO","g":null},{"i":"Overhead scan","a":"No white lights","n":"Airbus \"lights out\" idea – a white OFF or amber FAULT means something is not set.","t":"NEW","g":null}]},{"t":"3. Tablet (EFB)","s":[{"i":"Options page","a":"SimBrief ID entered","n":"VIDEO","t":"","g":null},{"i":"Dashboard page","a":"Press SimBrief","n":"Fetches the flight plan you just made.","t":"","g":null},{"i":"Payload page","a":"Load from SimBrief → apply","n":"Loads passengers, cargo and fuel. Choose \"instant\" or \"realistic\" loading time.","t":"VIDEO","g":null},{"i":"Note the weight","a":"Live gross weight (tonnes)","n":"From the payload page, e.g. 64.3. Needed for the takeoff calculator.","t":"VIDEO","g":null},{"i":"Takeoff page","a":"Sync weather + enter weight","n":"Sync pulls QNH, wind and temperature. Then enter the gross weight and runway.","t":"VIDEO","g":null},{"i":"Calculate","a":"Press","n":"Gives V1, VR, V2, flap configuration (e.g. CONF 1), trim (e.g. 0.7 UP) and FLEX temperature.","t":"","g":null},{"i":"Send to FMGS","a":"Press","n":"Sends the numbers to the MCDU so you can confirm them there.","t":"VIDEO","g":null}]},{"t":"4. MCDU programming","s":[{"i":"Scratchpad messages","a":"CLR","n":"Clear any old messages on the bottom line first.","t":"VIDEO","g":null},{"i":"INIT REQUEST","a":"Press, wait","n":"Imports FROM/TO, flight number, cost index and cruise level from SimBrief. Check they look right.","t":"","g":"INIT page"},{"i":"IRS INIT","a":"Check","n":"Make sure it is populated.","t":"VIDEO","g":"INIT page"},{"i":"WIND","a":"WIND REQUEST","n":"Winds should already be in from SimBrief. Jon says missing winds is the most common reason the descent goes wrong.","t":"VIDEO","g":"INIT page"},{"i":"ZFW / ZFWCG","a":"Press the key to fill","n":"No need to type it from the tablet any more – pressing the key fills it in.","t":"FIXED","g":"INIT page 2 (fuel)"},{"i":"BLOCK fuel","a":"FUEL PLANNING → CONFIRM","n":"Wait a few seconds for the block fuel, then confirm. Must be done before engine start.","t":"FIXED","g":"INIT page 2 (fuel)"},{"i":"Departure","a":"Runway + SID","n":"Left key next to your departure airport → DEPARTURE → runway → SID → INSERT. Check against the SimBrief plan.","t":"","g":"F-PLN page"},{"i":"Arrival","a":"Runway, approach + STAR","n":"The bottom line is always the destination. Press its key → ARRIVAL → approach (e.g. ILS 24) → STAR → INSERT. Can be done now or in cruise.","t":"VIDEO","g":"F-PLN page"},{"i":"Discontinuities","a":"Clear","n":"Scroll through and clear any F-PLN DISCONTINUITY. VIDEO: The aircraft sometimes lists a waypoint twice (a known bug) – clear the duplicate. Also clear a MANUAL leg at the end if one appears.","t":"","g":"F-PLN page"},{"i":"Route check","a":"ND in PLAN mode","n":"Set the ND to PLAN and scroll the F-PLN to step through the route on the map. Change odd-looking turns if needed.","t":"VIDEO","g":"F-PLN page"},{"i":"V1, VR, V2","a":"Type in from EFB","n":"The speeds arrive from the tablet but you have to re-key them.","t":"VIDEO","g":"PERF page (takeoff)"},{"i":"FLAPS/THS","a":"e.g. 1/UP0.7","n":"Flap setting / trim from the EFB.","t":"","g":"PERF page (takeoff)"},{"i":"FLEX TO TEMP","a":"From EFB, e.g. 58","n":"Leave blank if you plan a TOGA takeoff.","t":"","g":"PERF page (takeoff)"},{"i":"CONFIRM TO DATA","a":"Press (bottom right)","n":"Confirms the takeoff data sent from the tablet.","t":"VIDEO","g":"PERF page (takeoff)"},{"i":"TRANS ALT","a":"Check","n":"Transition altitude from the chart (6000 ft at Stansted and Edinburgh).","t":"NEW","g":"PERF page (takeoff)"},{"i":"THR RED / ACC","a":"Usually leave default","n":"Typically 1500 ft above the airport.","t":"","g":"PERF page (takeoff)"},{"i":"PERF APPR","a":"Leave for now","n":"Minimums and destination weather are entered in cruise, not here.","t":"FIXED","g":"PERF page (takeoff)"}]},{"t":"5. Autopilot panel (FCU) & glareshield","s":[{"i":"QNH (baro)","a":"Set from METAR","n":"The Q number, e.g. Q1002 → 1002 hPa. VIDEO: The sim may be slightly out – check against the weather report. Jon uses a keyboard shortcut to set it automatically.","t":"","g":null},{"i":"Flight directors (FD)","a":"ON – both sides","n":"Once on, speed/heading show dashes (- - -) and a dot = managed by the flight plan.","t":"VIDEO","g":null},{"i":"Altitude","a":"Set (see note)","n":"No ATC – set your cruise level (Jon sets 34,000). The aircraft still obeys the SID's altitude limits in managed mode. With ATC – set the altitude they clear you to.","t":"FIXED","g":null},{"i":"A/THR (autothrust)","a":"Do NOT press","n":"Autothrust arms itself when you set the thrust levers to FLX or TOGA.","t":"FIXED","g":null},{"i":"CSTR (EFIS panel)","a":"ON","n":"Shows altitude and speed constraints on the ND.","t":"VIDEO","g":null},{"i":"LS","a":"OFF","n":"Only needed on approach.","t":"","g":null},{"i":"ND mode / range","a":"ARC, 10 nm","n":"Put back to ARC if you used PLAN for the route check.","t":"","g":null},{"i":"iniBuilds click controls","a":"Know your mode","n":"Click top half of a knob to push, bottom half to pull. (Lock mode: hold left-click then right-click = push, middle-click = pull.)","t":"VIDEO","g":"Knobs: push = managed (dot shows, aircraft decides). Pull = selected (number shows, you decide)."}]},{"t":"6. Before pushback","s":[{"i":"Seatbelt signs","a":"ON","n":"","t":"","g":null},{"i":"APU","a":"Running","n":"","t":"","g":null},{"i":"EXT PWR","a":"OFF","n":"Overhead, then remove the GPU in the EFB Ground page.","t":"","g":null},{"i":"Doors","a":"All closed","n":"Check on the ECAM DOOR page or the EFB.","t":"","g":null},{"i":"Beacon","a":"ON","n":"Always on before pushback or engine start.","t":"","g":null},{"i":"Transponder","a":"AUTO / ON, TA","n":"Squawk code from ATC if using it. ALT RPTG ON. VIDEO: Jon sets TA on the ground and TA/RA once airborne.","t":"","g":null},{"i":"Thrust levers","a":"IDLE","n":"","t":"","g":null},{"i":"Pushback","a":"EFB Ground page (or keyboard)","n":"Wait for the tug, release the parking brake to move, choose left or right. Stop, then parking brake ON.","t":"VIDEO","g":null}]},{"t":"7. Engine start (during or after pushback)","s":[{"i":"Fuel pumps","a":"All ON","n":"If not already on.","t":"","g":null},{"i":"APU BLEED","a":"ON","n":"Supplies the air that spins the engines up.","t":"","g":null},{"i":"ENG MODE","a":"IGN / START","n":"The engine page appears on the lower ECAM.","t":"","g":null},{"i":"First ENG MASTER","a":"ON","n":"Current Airbus procedure starts engine 1 first. VIDEO: Jon starts engine 2 first – either works in the sim.","t":"","g":null},{"i":"Wait","a":"Engine stable at idle","n":"No \"AVAIL\" for engines. The start is fully automatic – wait until N2 settles and the highlight around it goes out.","t":"FIXED","g":null},{"i":"Second ENG MASTER","a":"ON","n":"","t":"","g":null},{"i":"Wait","a":"Engine stable at idle","n":"","t":"","g":null},{"i":"ENG MODE","a":"NORM","n":"","t":"","g":null}]},{"t":"8. After start","s":[{"i":"APU BLEED","a":"OFF","n":"","t":"","g":null},{"i":"APU MASTER","a":"OFF","n":"","t":"","g":null},{"i":"Anti-ice","a":"As required","n":"Engine anti-ice on at 10°C or colder with cloud, rain, fog or snow.","t":"NEW","g":null},{"i":"Flaps","a":"Set (from EFB)","n":"e.g. flaps 1.","t":"","g":null},{"i":"Pitch trim","a":"Set (from EFB)","n":"Jon forgot this – matters most when the trim number is large.","t":"VIDEO","g":null},{"i":"Weather radar / PWS","a":"SYS 1, PWS ON","n":"\"Windshear to 1\" in your original notes.","t":"VIDEO","g":null},{"i":"Ground spoilers","a":"ARM","n":"Pull the speed brake lever up.","t":"","g":null},{"i":"Autobrake","a":"MAX","n":"","t":"","g":null},{"i":"TERR ON ND","a":"ON (one side)","n":"","t":"","g":null},{"i":"Flight controls check","a":"Full stick + rudder","n":"Watch the F/CTL page on the lower ECAM.","t":"","g":null},{"i":"Nose light","a":"TAXI","n":"","t":"","g":null},{"i":"Runway turn off lights","a":"ON","n":"","t":"","g":null}]},{"t":"9. Taxi","s":[{"i":"Parking brake","a":"OFF","n":"The aircraft creeps forward at idle – that's normal.","t":"VIDEO","g":null},{"i":"Thrust","a":"Small amount only if needed","n":"Keep below about 30 kts straight and about 10 kts in turns.","t":"NEW","g":null},{"i":"Brake check","a":"Gentle press once moving","n":"NEW","t":"","g":null}]},{"t":"10. Holding point / line-up","s":[{"i":"Stop","a":"Parking brake ON (optional)","n":"Gives you time to check everything properly.","t":"VIDEO","g":null},{"i":"Landing lights","a":"ON","n":"","t":"","g":null},{"i":"Strobe","a":"ON","n":"Jon puts them fully on for takeoff (AUTO also works).","t":"VIDEO","g":null},{"i":"Nose light","a":"T.O.","n":"","t":"","g":null},{"i":"Takeoff memo (upper ECAM)","a":"Check all items green","n":"Flaps, spoilers armed, cabin, signs, autobrake. Anything still blue needs doing.","t":"VIDEO","g":null},{"i":"T.O. CONFIG","a":"Press","n":"Memo should change to \"T.O. CONFIG NORMAL\". If not, something has been missed.","t":"","g":null},{"i":"Wing lights","a":"Only if needed","n":"For checking ice at night.","t":"","g":null},{"i":"Runway check","a":"Correct runway, PFD heading","n":"NEW","t":"","g":null}]},{"t":"11. Takeoff","s":[{"i":"Thrust","a":"~50% N1, let it stabilise","n":"Holding brakes, or set it as you roll.","t":"","g":null},{"i":"Thrust levers","a":"FLX/MCT or TOGA","n":"As calculated in the EFB.","t":"","g":null},{"i":"Check FMA (top of PFD)","a":"MAN FLX (or MAN TOGA) | SRS | RWY","n":"A/THR in blue = armed.","t":"NEW","g":null},{"i":"Centreline","a":"Rudder","n":"Crosswind needs a lot of rudder; the aircraft will crab once airborne.","t":"VIDEO","g":null},{"i":"Rotate","a":"At VR","n":"Gently to about 15° nose up, then follow the flight director bars.","t":"","g":null},{"i":"Gear","a":"UP – positive climb","n":"","t":"","g":null}]},{"t":"12. After takeoff & climb","s":[{"i":"Autopilot 1","a":"ON","n":"Jon engages it straight after gear up.","t":"VIDEO","g":null},{"i":"Thrust reduction (~1500 ft)","a":"Levers to CL","n":"\"LVR CLB\" flashes. Pull back to CL and let go – autothrust now controls thrust.","t":"","g":null},{"i":"Flaps","a":"Retract by speed","n":"Flaps 1 → UP at \"S\" on the speed tape. VIDEO: The aircraft holds the flaps speed limit until you retract them, then accelerates.","t":"FIXED","g":null},{"i":"Ground spoilers","a":"DISARM","n":"","t":"","g":null},{"i":"Nose & runway turn off lights","a":"OFF","n":"","t":"","g":null},{"i":"TCAS","a":"TA/RA","n":"VIDEO","t":"","g":null},{"i":"Watch constraints","a":"Managed climb obeys SID","n":"e.g. holds 4000 ft until the SID allows higher.","t":"VIDEO","g":null},{"i":"Transition altitude","a":"Pull baro knob → STD","n":"QNH flashes when you pass it (6000 ft at Stansted). VIDEO: Do BOTH sides – the co-pilot's baro is not linked in this aircraft.","t":"NEW","g":null},{"i":"10,000 ft","a":"Landing lights OFF/RETRACT","n":"Speed limit of 250 kts lifts and the aircraft accelerates.","t":"","g":null},{"i":"Seatbelt signs","a":"OFF","n":"At or near cruise if smooth.","t":"","g":null}]},{"t":"13. Cruise & approach preparation","s":[{"i":"FMA","a":"ALT CRZ","n":"Check you are at cruise level.","t":"","g":null},{"i":"Fuel","a":"Monitor","n":"\"DEST EFOB BELOW MIN\" means less fuel than planned on arrival (usually wind changes). Check the F-PLN page – it isn't an emergency.","t":"VIDEO","g":null},{"i":"Top of descent","a":"Find T/D","n":"Shown on the ND as T/D and in the F-PLN.","t":"","g":null},{"i":"Destination weather","a":"Get METAR","n":"QNH, temperature, wind → landing runway.","t":"","g":"About 70–100 nm before top of descent"},{"i":"Arrival","a":"Check / enter in F-PLN","n":"If not done before departure. Clear discontinuities.","t":"","g":"About 70–100 nm before top of descent"},{"i":"PERF APPR","a":"QNH, TEMP, MAG WIND","n":"Next PHASE until you reach the approach page. Wind as 210/05.","t":"","g":"About 70–100 nm before top of descent"},{"i":"Minimums","a":"BARO or RADIO","n":"From the approach chart. CAT I = BARO (decision altitude, above sea level). CAT III = RADIO (decision height above the runway, e.g. 50 ft). VIDEO: You can only enter one – typing one wipes the other.","t":"","g":"About 70–100 nm before top of descent"},{"i":"Landing flaps","a":"FULL (or CONF 3)","n":"FULL is normal.","t":"","g":"About 70–100 nm before top of descent"},{"i":"RAD NAV page","a":"Check ILS frequency & course","n":"e.g. 108.9 / 240° at Edinburgh. Should fill in automatically – check against the chart.","t":"VIDEO","g":"About 70–100 nm before top of descent"},{"i":"Autobrake","a":"LO (MED for short or wet runway)","n":"Can wait until final approach.","t":"","g":"About 70–100 nm before top of descent"},{"i":"Brief yourself","a":"Runway, minimums, missed approach","n":"Note the missed approach altitude from the chart.","t":"NEW","g":"About 70–100 nm before top of descent"}]},{"t":"14. Descent","s":[{"i":"At top of descent","a":"Set final altitude, push ALT","n":"Set the approach altitude (e.g. 3000 ft) and push for managed descent. The aircraft still obeys every STAR constraint on the way down.","t":"VIDEO","g":null},{"i":"Descent profile","a":"Watch the descent indicator","n":"Keep the marker on the PFD centred. If you fall above the profile, use speed brakes (1–2 notches) and stow them once back on track.","t":"VIDEO","g":null},{"i":"Know the aircraft","a":"Watch speed/altitude","n":"This aircraft isn't always good at planning its descent – expect to help it with speed brakes, especially with a tailwind.","t":"VIDEO","g":null},{"i":"Around FL250","a":"Seatbelt signs ON","n":"","t":"","g":null},{"i":"10,000 ft","a":"Landing lights ON","n":"Within 500 ft of 10,000. Speed drops to 250 kts automatically.","t":"","g":null},{"i":"Ice detected","a":"Engine + wing anti-ice ON","n":"The ECAM tells you when ice is detected. Probe heat can be forced ON too.","t":"VIDEO","g":null},{"i":"Transition level","a":"Push baro knob → QNH","n":"e.g. at 6000 ft into Edinburgh. VIDEO: Set both sides.","t":"NEW","g":null}]},{"t":"15. Approach","s":[{"i":"Approach phase","a":"ACTIVATE","n":"PERF APPR → ACTIVATE APPR PHASE → CONFIRM, about 10–15 nm out, or it activates itself at the DECEL point.","t":"NEW","g":null},{"i":"LS","a":"ON – both sides","n":"Shows the ILS on the PFD. VIDEO: Can also switch the co-pilot ND to ROSE LS.","t":"","g":null},{"i":"Flaps 1","a":"Below 230 kts / at green dot","n":"VIDEO","t":"","g":null},{"i":"APPR","a":"Press","n":"Press before the glideslope diamond reaches halfway – you must be below the glideslope. LOC and G/S show blue (armed).","t":"VIDEO","g":null},{"i":"Autopilot 2","a":"ON","n":"Both autopilots can be on once APPR is armed. Needed for autoland.","t":"VIDEO","g":null},{"i":"Flaps 2","a":"Below 200 kts / at \"S\"","n":"","t":"","g":null},{"i":"Gear","a":"DOWN","n":"Runway turn off ON, nose TAXI.","t":"","g":null},{"i":"Ground spoilers","a":"ARM","n":"","t":"","g":null},{"i":"Glideslope captured","a":"G/S green","n":"The aircraft now descends on the glideslope and slows itself.","t":"","g":null},{"i":"Flaps 3, then FULL","a":"As speed reduces","n":"The aircraft slows to VAPP.","t":"","g":null},{"i":"Missed approach altitude","a":"Set on FCU","n":"Once on the glideslope.","t":"NEW","g":null},{"i":"Landing memo","a":"All green","n":"Spoilers armed, gear down, flaps full, signs, autobrake. \"LDG NO BLUE\".","t":"VIDEO","g":null},{"i":"Stable by 1000 ft","a":"Check","n":"On the glideslope, at VAPP, configured. If not, go around.","t":"NEW","g":null},{"i":"TCAS","a":"Goes to TA only by itself","n":"Normal on short final.","t":"VIDEO","g":null}]},{"t":"16. Landing (manual)","s":[{"i":"Autopilot","a":"OFF at ~400 ft","n":"Jon takes over at 400 ft using the disconnect button on the stick. Autothrust stays on until \"RETARD\".","t":"VIDEO","g":null},{"i":"Flare","a":"~30 ft","n":"Small, gentle back pressure. VIDEO: Jon floated a little – don't over-flare.","t":"","g":null},{"i":"Thrust","a":"IDLE on \"RETARD\"","n":"Callout at about 20 ft.","t":"","g":null},{"i":"Main gear touches","a":"Lower nose, reverse thrust","n":"Ground spoilers deploy and autobrake works automatically.","t":"","g":null},{"i":"70–80 kts","a":"Reverse idle","n":"Stow reversers by taxi speed.","t":"","g":null},{"i":"Autobrake","a":"Press brakes to cancel","n":"Take over braking at about 40 kts or below.","t":"","g":null}]},{"t":"16b. Autoland (CAT III ILS only)","s":[{"i":"After pressing APPR","a":"AP1 + AP2 ON","n":"FMA should show CAT 3 DUAL.","t":"","g":null},{"i":"Minimums","a":"RADIO, e.g. 50 ft","n":"Set on PERF APPR in cruise.","t":"","g":null},{"i":"~400 ft","a":"LAND on the FMA","n":"","t":"","g":null},{"i":"~40–30 ft","a":"FLARE on the FMA","n":"Confirmed on this aircraft.","t":"VIDEO","g":null},{"i":"\"RETARD\"","a":"Thrust levers IDLE","n":"You must do this yourself.","t":"","g":null},{"i":"Main gear touches","a":"Reverse thrust","n":"ROLL OUT on the FMA.","t":"","g":null},{"i":"Slowing down","a":"AP OFF, press brakes","n":"Take over and continue as a normal landing.","t":"","g":null}]},{"t":"17. After vacating the runway","s":[{"i":"Ground spoilers","a":"DISARM","n":"","t":"","g":null},{"i":"Flaps","a":"UP","n":"","t":"","g":null},{"i":"Landing lights","a":"RETRACT","n":"","t":"","g":null},{"i":"Nose light","a":"TAXI","n":"Runway turn off can stay ON while taxiing.","t":"","g":null},{"i":"Strobe","a":"AUTO","n":"Goes off by itself on the ground.","t":"","g":null},{"i":"TCAS","a":"STBY","n":"Keep the transponder ON.","t":"","g":null},{"i":"Weather radar / PWS","a":"OFF","n":"","t":"","g":null},{"i":"ND mode","a":"ARC or NAV","n":"The flight plan disappears after landing – normal.","t":"VIDEO","g":null},{"i":"APU","a":"START (if not using GPU)","n":"","t":"","g":null},{"i":"Wait","a":"3 minutes after landing","n":"Engine cool-down.","t":"","g":"Optional: single-engine taxi in"},{"i":"Yellow electric pump","a":"ON","n":"Top right of the hydraulic panel.","t":"","g":"Optional: single-engine taxi in"},{"i":"ENG MASTER 2","a":"OFF","n":"Keep engine 1 running – it drives the green hydraulic system for the normal brakes.","t":"FIXED","g":"Optional: single-engine taxi in"}]},{"t":"18. Parking","s":[{"i":"Approaching stand","a":"Nose + runway turn off lights OFF","n":"","t":"","g":null},{"i":"Parking brake","a":"ON","n":"","t":"","g":null},{"i":"Power","a":"APU running, or GPU via EFB","n":"Ask for the GPU on the EFB Ground page, then EXT PWR ON, so you keep power when the engines stop.","t":"VIDEO","g":null},{"i":"ENG MASTER 1 + 2","a":"OFF","n":"Yellow electric pump OFF if used.","t":"","g":null},{"i":"Beacon","a":"OFF","n":"Once the engines have spun down.","t":"","g":null},{"i":"Seatbelt signs","a":"OFF","n":"","t":"","g":null},{"i":"Anti-ice","a":"OFF","n":"VIDEO","t":"","g":null},{"i":"Fuel pumps","a":"OFF","n":"","t":"","g":null},{"i":"Transponder","a":"STBY","n":"","t":"","g":null},{"i":"APU BLEED, APU MASTER","a":"OFF","n":"Once on ground power.","t":"","g":null},{"i":"Doors / jet bridge","a":"Open","n":"Door from the EFB. Jet bridge via the ATC menu → ground services (it is sometimes back-to-front – a sim bug).","t":"VIDEO","g":null}]},{"t":"19. Full shutdown (leaving the aircraft)","s":[{"i":"Exterior lights","a":"All OFF","n":"Including NAV & LOGO and strobe.","t":"","g":null},{"i":"Emergency exit lights","a":"OFF","n":"","t":"","g":null},{"i":"No smoking","a":"OFF","n":"","t":"","g":null},{"i":"Crew oxygen","a":"OFF","n":"","t":"","g":null},{"i":"ADIRS 1, 2, 3","a":"OFF","n":"","t":"","g":null},{"i":"Final scan","a":"Check overhead","n":"Some cautions showing at this stage are normal.","t":"VIDEO","g":null},{"i":"EXT PWR","a":"OFF","n":"","t":"","g":null},{"i":"BAT 1 + BAT 2","a":"OFF","n":"If the APU was on, wait about 2 minutes after switching it off.","t":"NEW","g":null}]}];
const KEY='a320-g2g-v1';
let st={p:0,s:0,done:{},view:'check',notes:true};
try{const j=JSON.parse(localStorage.getItem(KEY)||'null'); if(j&&j.done) st=Object.assign(st,j);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const id=(p,s)=>p+'.'+s;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function noteHTML(n,tag){
  let h=tag?`<span class="tag ${tag}">${tag}</span>`:'';
  h+=esc(n).replace(/\b(VIDEO|NEW|FIXED):\s*/g,(m,t)=>` <span class="tag ${t}">${t}</span>`);
  return h;
}
const total=DATA.reduce((a,p)=>a+p.s.length,0);
const phaseDone=p=>DATA[p].s.filter((_,i)=>st.done[id(p,i)]).length;
function sidebar(){
  const done=Object.values(st.done).filter(Boolean).length;
  document.getElementById('ovbar').style.width=(done/total*100)+'%';
  document.getElementById('ovtxt').textContent=`${done} of ${total} steps done`;
  document.getElementById('phases').innerHTML=DATA.map((p,i)=>{const d=phaseDone(i),n=p.s.length;
    return `<button type="button" class="ph ${i===st.p&&st.view!=='ref'?'on':''} ${d===n?'done':''}" data-p="${i}"><span>${esc(p.t)}</span><span class="c">${d===n?'✓':d+'/'+n}</span></button>`}).join('');
  document.getElementById('phaseSel').innerHTML=DATA.map((p,i)=>`<option value="${i}" ${i===st.p?'selected':''}>${esc(p.t)} (${phaseDone(i)}/${p.s.length})</option>`).join('');
  document.getElementById('refBtn').classList.toggle('on',st.view==='ref');
  const lb=document.getElementById('listBtn'); lb.classList.toggle('on',st.view==='list'); lb.textContent=st.view==='list'?'Step-by-step view':'List view';
  document.getElementById('listBtn2').textContent=st.view==='list'?'Steps':'List';
}
function render(){
  sidebar();
  const v=document.getElementById('view');
  if(st.view==='ref'){v.innerHTML=REF;document.getElementById('main').scrollTop=0;return;}
  if(st.view==='list'){v.innerHTML=listHTML();return;}
  const P=DATA[st.p], S=P.s[st.s], k=id(st.p,st.s), isD=!!st.done[k];
  const d=phaseDone(st.p);
  const last=st.p===DATA.length-1;
  v.innerHTML=`
  <div class="phase-head"><h2>${esc(P.t)}</h2><span class="count">Step ${st.s+1} of ${P.s.length}</span></div>
  <div class="pbar">${P.s.map((_,i)=>`<span class="${st.done[id(st.p,i)]?'d':''} ${i===st.s?'cur':''}"></span>`).join('')}</div>
  <section class="card ${isD?'isdone':''}" aria-live="polite">
    ${S.g?`<div class="grp">${esc(S.g)}</div>`:''}
    <h3 class="item">${esc(S.i)}</h3>
    <div class="action">${esc(S.a)}</div>
    <div class="note">${(S.n||S.t)?noteHTML(S.n,S.t):''}</div>
    ${isD?'<div class="donebadge">✓ Done</div>':''}
  </section>
  <div class="controls">
    <button type="button" class="btn back" id="back" ${st.p===0&&st.s===0?'disabled':''}>← Back</button>
    <button type="button" class="btn go ${isD?'undo':''}" id="go">${isD?'Untick':'Done →'}</button>
  </div>
  <div class="hint">Tap a step below to jump to it. With a keyboard: Space = done, ← → to move.</div>
  ${d===P.s.length?`<div class="phase-done"><span><b>${esc(P.t)}</b> complete.</span>${last?'<span>Flight finished – nice work.</span>':`<button type="button" id="nextPhase">Next: ${esc(DATA[st.p+1].t)} →</button>`}</div>`:''}
  <div class="list"><h3>All steps in this phase</h3>
    ${P.s.map((x,i)=>`<button type="button" class="row ${st.done[id(st.p,i)]?'d':''} ${i===st.s?'cur':''}" data-s="${i}"><span class="tick">${st.done[id(st.p,i)]?'✓':''}</span><span class="ri">${x.g&&(i===0||P.s[i-1].g!==x.g)?`<span style="display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px">${esc(x.g)}</span>`:''}${esc(x.i)}</span><span class="ra">${esc(x.a)}</span></button>`).join('')}
  </div>`;
}
function listHTML(){
  return `<div class="lv-head"><h2>All steps</h2><button type="button" class="ghost notes-toggle" id="notesBtn" style="flex:0 0 auto">${st.notes?'Hide notes':'Show notes'}</button></div>
  <div class="hint" style="text-align:left">Tap any row to tick or untick it. Ticks are shared with the step-by-step view.</div>`+
  DATA.map((P,p)=>{const d=phaseDone(p),n=P.s.length;let g=null;
    return `<section class="list lv-phase" id="ph-${p}"><h3 class="${d===n?'all':''}"><span>${esc(P.t)}</span><span class="c">${d===n?'✓ ':''}${d}/${n}</span></h3>`+
    P.s.map((x,i)=>{let h='';if(x.g&&x.g!==g){h+=`<div class="lgrp">${esc(x.g)}</div>`;}g=x.g;const dn=st.done[id(p,i)];
      return h+`<button type="button" class="lrow ${dn?'d':''}" data-lp="${p}" data-ls="${i}" aria-pressed="${dn?'true':'false'}"><span class="tick">${dn?'✓':''}</span><span><span class="li">${esc(x.i)}</span>${st.notes&&(x.n||x.t)?`<span class="ln">${noteHTML(x.n,x.t)}</span>`:''}</span><span class="la">${esc(x.a)}</span></button>`}).join('')+`</section>`}).join('');
}
function go(){
  const k=id(st.p,st.s);
  if(st.done[k]){delete st.done[k];save();render();return;}
  st.done[k]=true;
  const P=DATA[st.p];
  // move to the next unticked step in this phase, else next phase
  let n=-1; for(let i=st.s+1;i<P.s.length;i++){if(!st.done[id(st.p,i)]){n=i;break;}}
  if(n<0){for(let i=0;i<P.s.length;i++){if(!st.done[id(st.p,i)]){n=i;break;}}}
  if(n>=0) st.s=n;
  save();render();
}
function move(dir){
  if(dir>0){ if(st.s<DATA[st.p].s.length-1) st.s++; else if(st.p<DATA.length-1){st.p++;st.s=0;} }
  else { if(st.s>0) st.s--; else if(st.p>0){st.p--;st.s=DATA[st.p].s.length-1;} }
  save();render();
}
function setPhase(p){st.p=p;st.view='check';const P=DATA[p];let n=0;for(let i=0;i<P.s.length;i++){if(!st.done[id(p,i)]){n=i;break;}}st.s=n;save();render();document.getElementById('main').scrollTop=0;}
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.id==='go') go();
  else if(t.id==='back') move(-1);
  else if(t.id==='nextPhase') setPhase(st.p+1);
  else if(t.dataset.lp!==undefined){const k=id(+t.dataset.lp,+t.dataset.ls);if(st.done[k])delete st.done[k];else st.done[k]=true;st.p=+t.dataset.lp;st.s=+t.dataset.ls;save();const y=document.getElementById('main').scrollTop;render();document.getElementById('main').scrollTop=y;}
  else if(t.id==='notesBtn'){st.notes=!st.notes;save();const y=document.getElementById('main').scrollTop;render();document.getElementById('main').scrollTop=y;}
  else if(t.id==='listBtn'||t.id==='listBtn2'){st.view=st.view==='list'?'check':'list';save();render();if(st.view==='list'){const el=document.getElementById('ph-'+st.p);if(el)el.scrollIntoView({block:'start'});}else document.getElementById('main').scrollTop=0;}
  else if(t.dataset.p!==undefined && t.classList.contains('ph')){ if(st.view==='list'){st.p=+t.dataset.p;save();sidebar();document.getElementById('ph-'+st.p).scrollIntoView({block:'start',behavior:'smooth'});} else setPhase(+t.dataset.p);}
  else if(t.dataset.s!==undefined){st.s=+t.dataset.s;save();render();window.scrollTo(0,0);document.getElementById('main').scrollTop=0;}
  else if(t.id==='refBtn'||t.id==='refBtn2'||t.id==='refBack'){st.view=st.view==='ref'?'check':'ref';save();render();}
  else if(t.id==='resetBtn'||t.id==='resetBtn2'){document.getElementById('modal').classList.add('show');document.getElementById('mNo').focus();}
  else if(t.id==='mNo'){document.getElementById('modal').classList.remove('show');}
  else if(t.id==='mYes'){st={p:0,s:0,done:{},view:st.view==='ref'?'check':st.view,notes:st.notes};save();document.getElementById('modal').classList.remove('show');render();}
});
document.getElementById('phaseSel').addEventListener('change',e=>{if(st.view==='list'){st.p=+e.target.value;save();document.getElementById('ph-'+st.p).scrollIntoView({block:'start'});}else setPhase(+e.target.value);});
document.addEventListener('keydown',e=>{
  if(document.getElementById('modal').classList.contains('show')){if(e.key==='Escape')document.getElementById('modal').classList.remove('show');return;}
  if(st.view!=='check'||e.target.tagName==='SELECT')return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();go();}
  else if(e.key==='ArrowRight'){move(1);} else if(e.key==='ArrowLeft'){move(-1);}
});
// swipe left/right on the card area
let sx=null,sy=null;
document.getElementById('view').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.getElementById('view').addEventListener('touchend',e=>{if(sx===null||st.view!=='check')return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)move(dx<0?1:-1);sx=null;},{passive:true});
